# ABOUTME: GitHub Actions workflow — runs deterministic quality gates on PR and push to main.
# ABOUTME: Gated by lint, unit tests, and a clean build. (Vercel handles deploys.)
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
